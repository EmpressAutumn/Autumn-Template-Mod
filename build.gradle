plugins {
    id "java"
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.1.7"
    id "com.matyrobbrt.mc.registrationutils" version "$regutils_version"
}
java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of("$java_version"))
    }
}
registrationUtils {
    group "com.atom596.template.regutils"
    projects {
        common { type "common" }
        fabric { type "fabric" }
        neoforge { type "neoforge" }
    }
}
subprojects {
    apply plugin: 'java'
    apply plugin: 'idea'
    apply plugin: 'java-library'

    repositories {
        // Fix issue with lwjgl-freetype not being found on macOS / ForgeGradle issue
        //
        // Could not resolve all files for configuration ':_compileJava_1'.
        // Could not find lwjgl-freetype-3.3.3-natives-macos-patch.jar (org.lwjgl:lwjgl-freetype:3.3.3).
        maven {
            url "https://libraries.minecraft.net"
            content {
                includeModule("org.lwjgl", "lwjgl-freetype")
            }
        }
        mavenCentral()
        maven { url "https://oss.sonatype.org/content/repositories/snapshots/" }
        maven { url "https://repo.lucko.me/" }
        maven { url "https://jitpack.io" }
    }
}
